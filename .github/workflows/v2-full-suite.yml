name: v2-full-suite

on:
  push:
    branches:
      - remediation/p0-security-fixes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: realestate
          POSTGRES_PASSWORD: localpass
          POSTGRES_DB: realestate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realestate -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://realestate:localpass@127.0.0.1:5432/realestate_db
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt "moto>=5" pytest
      - name: Create schema on the throwaway service database
        run: python -c "import models; from database import engine; models.Base.metadata.create_all(bind=engine)"
      - name: Run the suite
        run: pytest tests -q --tb=line --junitxml=pytest-report.xml
      - name: Prove the 27 V2 tests passed in this run
        if: always()
        run: python scripts/check_v2_suite_provenance.py pytest-report.xml
      - name: Upload the pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
